# Runs on the self-hosted runner on the development desktop
# (WINDOWS_ROADMAP.md 0.13): on every push to windows-port, the GUI suite,
# then (if it passed) the release build installed where the runner's
# GHOSTTY_INSTALL_PREFIX points, then the unit tests. The runner runs in the owner's signed-in
# session: the GUI suite needs the GPU's OpenGL, which a service (session 0)
# doesn't get. windows-port.yml stays as the manual clean-machine test.
#
# The runner executes whatever this workflow runs, so it triggers only on
# pushes to windows-port and by hand: never on pull requests or other
# branches (Dependabot's branches carry edited workflow files). It runs only
# in the private repository, murr2k/ghostty-windows: the public murrtty
# repository has the same files but must never reach the runner.
name: Windows port (desktop)

on:
  push:
    branches: [windows-port]
    paths-ignore: ["**.md"]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push cancels the older run; runs on other refs (dispatched by
# hand) queue for the one runner instead.
concurrency:
  group: windows-port-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Unit tests and GUI suite (desktop)
    if: github.repository == 'murr2k/ghostty-windows'
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Keep Zig's caches, the builder's Zig and the unpacked
          # dependencies between runs so builds are incremental; the hosted
          # workflow covers clean builds.
          clean: false

      # .zig-cache grows with every build (14 GB in a day of development).
      - name: Cap the build cache
        shell: pwsh
        run: |
          if (Test-Path .zig-cache) {
            $gb = (Get-ChildItem .zig-cache -Recurse -File -Force | Measure-Object Length -Sum).Sum / 1GB
            "build cache: {0:N1} GB" -f $gb
            if ($gb -gt 20) { Remove-Item -Recurse -Force .zig-cache; "cleared" }
          }

      - name: Zig
        id: zig
        shell: cmd
        run: .\build-windows.cmd -SetupOnly

      # The GUI suite and the install come before the unit tests (14 minutes
      # of the run), so a build that passes the GUI suite is installed about
      # 9 minutes after the push. The unit tests still decide the run's
      # status, and the build replaced is kept for a rollback.
      #
      # pixels is left out: it briefly adds a taskbar button on the owner's
      # desktop.
      - name: GUI suite
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        shell: cmd
        env:
          GHOSTTY_GUI_TEST_DIR: ${{ runner.temp }}\gui-tests
        run: test\windows\gui\run.cmd --skip pixels

      - name: Upload failed GUI runs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-tests
          path: ${{ runner.temp }}\gui-tests
          retention-days: 7
          if-no-files-found: ignore

      # The build being replaced moves to bin\murrtty.prev.exe first: Windows
      # lets a running exe be renamed (not overwritten), so an open murrtty
      # keeps running and the next launch gets the new build. Copy
      # murrtty.prev.exe back over murrtty.exe to roll back. Older prev
      # copies go once nothing has them open. Microsoft's ConPTY beside it
      # (roadmap 2.6) is held the same way while murrtty runs (conpty.dll
      # loaded, an OpenConsole.exe per pane), so it moves aside too, as
      # conpty.prev.dll and OpenConsole.prev.exe (copy those back too to
      # roll back a ConPTY update; a held older one makes the new name
      # .prev-<stamp>). Any move failing, or the build, puts back what moved.
      - name: Install the release build
        if: success() && github.ref == 'refs/heads/windows-port'
        shell: pwsh
        run: |
          $prefix = $env:GHOSTTY_INSTALL_PREFIX
          if (-not $prefix) { "GHOSTTY_INSTALL_PREFIX isn't set on this runner; skipped"; exit 0 }
          $bin = Join-Path $prefix 'bin'
          $exe = Join-Path $bin 'murrtty.exe'
          foreach ($old in @('murrtty.prev*.exe', 'conpty.prev*.dll', 'OpenConsole.prev*.exe')) {
            Get-ChildItem $bin -Filter $old -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue }
          }
          $stamp = '{0:yyyyMMdd-HHmmss}' -f (Get-Date)
          $moved = [System.Collections.Generic.List[object]]::new()
          function Restore {
            for ($i = $moved.Count - 1; $i -ge 0; $i--) {
              $m = $moved[$i]
              if (-not (Test-Path $m.From)) { Move-Item $m.To $m.From -ErrorAction Continue }
            }
          }
          $running = @(Get-Process murrtty -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }).Count -gt 0
          try {
            foreach ($f in @('conpty.dll', 'OpenConsole.exe', 'murrtty.exe')) {
              $have = Join-Path $bin $f
              if (-not (Test-Path $have)) { continue }
              $base = [IO.Path]::GetFileNameWithoutExtension($f)
              $ext = [IO.Path]::GetExtension($f)
              $to = Join-Path $bin "$base.prev$ext"
              if (Test-Path $to) { $to = Join-Path $bin "$base.prev-$stamp$ext" }
              Move-Item $have $to
              $moved.Add([pscustomobject]@{ From = $have; To = $to })
            }
          } catch {
            Restore
            throw
          }
          if ($running) { "::notice::murrtty was running; it keeps running, and its next launch gets this build" }
          & .\build-windows.cmd -Prefix $prefix
          $code = $LASTEXITCODE
          if ($code -ne 0) { Restore }
          exit $code

      - name: Unit tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        shell: pwsh
        run: |
          $zig = (Get-ChildItem .zig-toolchain -Recurse -Filter zig.exe)[0].FullName
          & $zig build test -Dtarget=x86_64-windows-gnu --summary failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
