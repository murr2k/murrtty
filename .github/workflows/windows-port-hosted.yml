# The GUI suite and the unit tests on GitHub's hosted runners
# (WINDOWS_ROADMAP.md 7.3), x64 on windows-2025 and ARM64 natively on
# windows-11-arm, started by hand. It runs only in the public repository,
# murr2k/murrtty, whose hosted minutes are free (the private one bills
# Windows minutes double, and GitHub's ARM64 Windows runners serve public
# repositories); there every upstream workflow is disabled, and the
# repository's actions policy (GitHub-owned actions only) stops any that
# isn't at startup. The guard job checks that. The self-hosted desktop
# runner never serves this repository.
#
# Hosted runners have no GPU. Direct3D 11, the default (roadmap 7.8),
# draws with Windows' WARP, asked for by MURRTTY_D3D so the software
# notice stays out of every window. An OpenGL build
# (renderer: opengl) draws with the Mesa llvmpipe it ships (bin\mesa,
# roadmap 6.3b), named by MURRTTY_OPENGL for every launch so that none
# starts itself again (the harness follows the process it started), and
# leaves out the scenarios of the graphics driver's own OpenGL
# (gl-missing, gl-library, gl-fallback) for that reason.
name: Windows port (hosted GUI suite)

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names to run (all but the GPU ones when empty)
        type: string
        default: ''
      renderer:
        description: The renderer to build (d3d11 or opengl; the default, d3d11, when empty)
        type: string
        default: ''

permissions: {}

concurrency:
  group: windows-port-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: No other workflow is active
    if: github.repository == 'murr2k/murrtty'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registered=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | "\(.path) \(.state)"')
          bad=0
          while read -r path state; do
            case "$path" in
              .github/workflows/windows-port-desktop.yml) ;;
              .github/workflows/windows-port*.yml) continue ;;
              .github/workflows/*) ;;
              *) continue ;;
            esac
            if [ "$state" = active ]; then
              echo "::error::$path is active. Disable it: gh workflow disable ${path##*/} -R $GITHUB_REPOSITORY"
              bad=1
            fi
          done <<< "$registered"
          exit $bad

  suite:
    name: GUI suite and unit tests (${{ matrix.arch }})
    needs: guard
    if: github.repository == 'murr2k/murrtty'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-windows-gnu
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-windows-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder installs the pinned Zig for the runner's architecture
      # into .zig-toolchain\ (SHA-256 checked).
      - name: Zig
        id: zig
        shell: cmd
        run: .\build-windows.cmd -SetupOnly

      # The runners' screen is 1024x768 and stays so (the GUI session has
      # no display mode to change: EnumDisplaySettings fails there); the
      # scenarios fit it, and skip what needs two windows side by side.
      - name: GUI suite
        id: gui
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        shell: pwsh
        env:
          GHOSTTY_GUI_TARGET: ${{ matrix.target }}
          GHOSTTY_GUI_TEST_DIR: ${{ runner.temp }}\gui
          MURRTTY_OPENGL: ${{ inputs.renderer == 'opengl' && format('{0}\zig-out\bin\mesa\opengl32.dll', github.workspace) || '' }}
          SCENARIOS: ${{ inputs.scenarios }}
          GHOSTTY_GUI_RENDERER: ${{ inputs.renderer }}
          # Direct3D 11 (roadmap 7.8): no GPU here, so WARP, asked for
          # (the software notice stays out of every window).
          MURRTTY_D3D: ${{ inputs.renderer != 'opengl' && 'warp' || '' }}
          # The opt-in spike runs when asked for by name (overlay-host,
          # S1; with no display here it skips). An empty value is off.
          GHOSTTY_GUI_SPIKE: ${{ contains(inputs.scenarios, 'overlay-host') && '1' || '' }}
          # The stress scenarios (16 flooding panes, 20 quits after a
          # reload, typing ahead in PowerShell): free minutes here.
          GHOSTTY_GUI_STRESS: '1'
        run: |
          $scenarioArgs = @(($env:SCENARIOS -split '\s+') | Where-Object { $_ })
          if ($scenarioArgs.Count -eq 0 -and $env:GHOSTTY_GUI_RENDERER -eq 'opengl') { $scenarioArgs = @('--skip', 'gl-missing', '--skip', 'gl-library', '--skip', 'gl-fallback') }
          # Expected here: pixels (no display is driven) and tab-drag's
          # second half (no room for two windows). Any other skip the
          # runner causes shows as a warning.
          & .\test\windows\gui\run.cmd --verbose --expect-skip pixels --expect-skip tab-drag @scenarioArgs
          exit $LASTEXITCODE

      # With murrtty's symbols, for a crash report's addresses.
      - name: Upload failed GUI runs
        if: ${{ failure() && steps.gui.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-tests-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}\gui
            zig-out\bin\murrtty.exe
            zig-out\bin\murrtty.pdb
          retention-days: 7
          if-no-files-found: ignore

      - name: Unit tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        shell: pwsh
        run: |
          $zig = (Get-ChildItem .zig-toolchain -Recurse -Filter zig.exe)[0].FullName
          & $zig build test -Dtarget=${{ matrix.target }} --summary failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
