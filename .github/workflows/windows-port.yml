# The Windows port's only workflow (WINDOWS_ROADMAP.md 0.11). Started by
# hand: Actions minutes on a private repository are billed, Windows minutes
# double.
#
# Every upstream workflow in this directory must stay disabled on this
# repository (gh workflow disable <file>): they run on upstream's runners,
# and the vouch workflows act on every issue and pull request. GitHub only
# registers a workflow when one of its events fires (a push for test.yml,
# an issue for the vouch ones), and only a registered one can be disabled,
# so until then the repository's actions policy (GitHub-owned actions
# only) stops each at startup: all of them use third-party actions. The
# guard job fails the run if any registered workflow other than the port's
# own (windows-port*.yml) is active, and lists the ones not registered yet.
name: Windows port

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: windows-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: No other workflow is active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registered=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | "\(.path) \(.state)"')
          files=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$GITHUB_SHA" \
            --jq '.[] | select(.type == "file" and (.name | test("\\.ya?ml$"))) | .path')
          bad=0
          while read -r path state; do
            case "$path" in
              .github/workflows/windows-port*.yml) continue ;;
              .github/workflows/*) ;;
              *) continue ;;
            esac
            if [ "$state" = active ]; then
              echo "::error::$path is active. Disable it: gh workflow disable ${path##*/} -R $GITHUB_REPOSITORY"
              bad=1
            fi
          done <<< "$registered"
          for path in $files; do
            case "$path" in .github/workflows/windows-port*.yml) continue ;; esac
            if ! awk -v p="$path" '$1 == p { f = 1 } END { exit !f }' <<< "$registered"; then
              echo "::notice::$path is not registered yet. Disable it once it is: gh workflow disable ${path##*/} -R $GITHUB_REPOSITORY"
            fi
          done
          exit $bad

  windows:
    name: Build and unit tests (Windows)
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-windows.cmd runs the builder in Windows PowerShell 5.1, as a
      # user's double-click does: it downloads the pinned Zig into
      # .zig-toolchain\, verifies its SHA-256 and builds ReleaseFast.
      - name: Builder (Windows PowerShell 5.1)
        shell: cmd
        run: .\build-windows.cmd

      - name: Unit tests
        shell: pwsh
        run: |
          $zig = (Get-ChildItem .zig-toolchain -Recurse -Filter zig.exe)[0].FullName
          & $zig build test -Dtarget=x86_64-windows-gnu --summary failures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
