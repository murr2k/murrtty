labels: ["needs-confirmation"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please read the [Status](https://github.com/murr2k/murrtty#status) section of the README (what is tested, untested and not implemented yet) and check for both existing [Discussions](https://github.com/murr2k/murrtty/discussions?discussions_q=) and [Issues](https://github.com/murr2k/murrtty/issues?q=sort%3Areactions-desc) prior to opening a new Discussion.
        >
        > murrtty is not affiliated with the Ghostty project. Please report murrtty's problems here, never to Ghostty.
  - type: markdown
    attributes:
      value: "# Issue Details"
  - type: textarea
    attributes:
      label: Issue Description
      description: |
        Provide a detailed description of the issue.  Include relevant information, such as:
        - The feature or configuration option you encounter the issue with.
        - Screenshots, screen recordings, or other supporting media (as needed).
        - If this is a regression of an existing issue that was closed or resolved, please include the previous item reference (Discussion, Issue, PR, commit) in your description.

        > [!TIP]
        > **Not sure what information to include?**
        > Here are some recommendations:
        > - **Input issues:** include your keyboard layout, a screenshot of logged keystrokes from the terminal inspector's "Keyboard" tab (<kbd>ctrl</kbd>+<kbd>shift</kbd>+<kbd>i</kbd>), and your input method (IME) and its version, if any.
        > - **Font issues:** include the problematic character(s), the output of `murrtty +show-face --string=<characters>` for them, and if they work in other applications.
        > - **Terminal emulation issues (including image rendering issues):** attach an [asciinema](https://docs.asciinema.org/getting-started/) cast file, shell script, or text file for reproduction.
        > - **Shell integration issues:** include your shell and its version (PowerShell 7, Windows PowerShell 5.1, or cmd with or without Clink) and the lines of your profile that change the prompt.
        > - **Renderer issues:** include your graphics card, its driver version, and the text of murrtty's dialog if it says OpenGL 4.3 is missing.
        > - **Crashes:** run `murrtty +crash-report` and attach the newest report from `%LOCALAPPDATA%\murrtty\crash`.
      placeholder: |
        When using SSH to connect to my Linux machine from murrtty, I try to run `clear`, and the screen does not clear.  Instead, I see the following error message printed to the terminal: `Error opening terminal: xterm-ghostty.`
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: |
        Describe how you expect murrtty to behave in this situation.  Include any relevant documentation links.
      placeholder: |
        The screen is cleared and the prompt is redrawn at the top of the window.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: |
        Describe how murrtty actually behaves in this situation.  If it is not immediately obvious how the actual behavior differs from the expected behavior described above, please be sure to mention the deviation specifically.
      placeholder: |
        The screen is not cleared, and an error is printed: `Error opening terminal: xterm-ghostty`.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction Steps
      description: |
        Provide a detailed set of step-by-step instructions for reproducing this issue.
      placeholder: |
        1. Open murrtty.
        2. Connect to a remote server via SSH.
        3. Try to execute `clear`.
        4. Observe `xterm-ghostty` error message above.
    validations:
      required: true
  - type: textarea
    attributes:
      label: murrtty Logs
      description: |
        Provide any captured murrtty logs during your issue reproduction in this field.  murrtty is a GUI program, so it writes its log only when started from a shell with its errors redirected: `murrtty.exe 2> murrtty.log`.
      render: text
  - type: textarea
    attributes:
      label: murrtty Version
      description: Paste the output of `murrtty +version` here.
      placeholder: |
        murrtty, based on Ghostty 1.4.0-windows-port+d448ca7

        Version
          - version: 1.4.0-windows-port+d448ca7
          - channel: tip
        Build Config
          - Zig version   : 0.17.0
          - build mode    : .fast
          - app runtime   : .win32
          - font engine   : .freetype_windows
          - renderer      : renderer.generic.Renderer(renderer.OpenGL)
          - libxev        : iocp
      render: text
    validations:
      required: true
  - type: input
    attributes:
      label: Windows Version
      description: |
        Please tell us which Windows version and build you are using (run `winver`).
      placeholder: Windows 11 24H2 (OS Build 26100.2314)
    validations:
      required: true
  - type: input
    attributes:
      label: Graphics Card and Driver
      description: |
        Please tell us your graphics card and its driver version (Device Manager, Display adapters), and whether murrtty runs over Remote Desktop or in a virtual machine.
      placeholder: NVIDIA GeForce RTX 2070, driver 566.36
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Shell
      description: |
        Which shell runs in the terminal where you see the issue?
      options:
        - PowerShell 7
        - Windows PowerShell 5.1
        - cmd
        - cmd with Clink
        - WSL
        - Other
    validations:
      required: false
  - type: textarea
    attributes:
      label: Minimal murrtty Configuration
      description: |
        Please provide the **minimum** configuration needed to reproduce this issue.  If you can still reproduce the issue with one of the lines removed, do not include that line.  If and **only** if you are not able to determine this, paste the contents of your configuration file here (<kbd>ctrl</kbd>+<kbd>,</kbd> opens it; murrtty reads `%LOCALAPPDATA%\murrtty\config.ghostty`, or Ghostty's own configuration when it has none).
      placeholder: |
        font-family = CommitMono Nerd Font
        font-family-bold = CommitMono Nerd Font
        font-family-italic = CommitMono Nerd Font
        font-family-bold-italic = CommitMono Nerd Font
        font-feature = +cv07
        font-size = 16
        font-thicken = true
        theme = catppuccin-mocha
      render: ini
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Relevant Configuration
      description: |
        If your issue involves other programs, tools, or applications in addition to murrtty (e.g. Neovim, PSReadLine, Clink, WSL, tmux, etc.), please provide the minimum configuration and versions needed for all relevant programs to reproduce the issue here.  If you use custom shaders for murrtty, also include them here, if applicable to your issue.
      placeholder: |
        #### PowerShell profile (PowerShell 7.5.1, PSReadLine 2.4.5)
        ```
        Set-PSReadLineOption -EditMode Emacs
        Set-PSReadLineKeyHandler -Chord Ctrl+d -Function DeleteCharOrExit
        ```
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        # User Acknowledgements
        > [!TIP]
        > Use these links to review the existing murrtty [Discussions](https://github.com/murr2k/murrtty/discussions?discussions_q=) and [Issues](https://github.com/murr2k/murrtty/issues?q=sort%3Areactions-desc).
  - type: checkboxes
    attributes:
      label: "I acknowledge that:"
      options:
        - label: I have read the README's Status section and confirm that my issue is NOT listed there as not implemented yet or as a known issue.
          required: true
        - label: I have searched the documentation (murrtty's README and Ghostty's configuration reference) and confirm there doesn't exist a configuration option that solves my issue.
          required: true
        - label: I have searched the murrtty repository (both open and closed Discussions and Issues) and confirm this is not a duplicate of an existing issue or discussion.
          required: true
        - label: I have checked the "Preview" tab on all text fields to ensure that everything looks right, and have wrapped all configuration and code in code blocks with a group of three backticks (` ``` `) on separate lines.
          required: true
